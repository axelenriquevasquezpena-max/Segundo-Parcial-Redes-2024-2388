# SW1 - hostname y direccionamiento de gestion (R6)
hostname SW1
interface Vlan1
 description Gestion-LAN
 ip address 192.168.16.2 255.255.255.0
 no shutdown
ip default-gateway 192.168.16.1
interface GigabitEthernet0/0
 description UPLINK-R1-f0/0
interface GigabitEthernet0/1
 description DB-P2
interface GigabitEthernet0/2
 description Kali-Zabbix
interface GigabitEthernet0/3
 description WindowsServer-AD-NPS
