# R7 - SSH administrativo seguro en SW1 (IOSvL2 15.2) + deshabilitar Telnet/HTTP
ip domain-name parcial.local
no ip http server
no ip http secure-server
no ip source-route
service password-encryption
username admin privilege 15 secret {{ADMIN_SSH}}
enable secret {{ENABLE_SECRET}}
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
line vty 0 4
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
banner login ^C*** PARCIAL REDES - Acceso restringido a personal autorizado ***^C
