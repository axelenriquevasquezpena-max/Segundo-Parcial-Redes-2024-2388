# R8 - SNMPv3 con autenticacion SHA y privacidad AES en SW1 (IOSvL2 15.2)
snmp-server view CIS-VIEW iso included
snmp-server group CIS-GRP v3 priv read CIS-VIEW
snmp-server user zabbix CIS-GRP v3 auth sha {{SNMP_AUTH}} priv aes 128 {{SNMP_PRIV}}
snmp-server location Laboratorio-Parcial-Redes
snmp-server contact Axel Vasquez - 2024-2388
snmp-server enable traps snmp authentication linkdown linkup coldstart warmstart
