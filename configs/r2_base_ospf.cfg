# R2 - direccionamiento base + OSPF con autenticacion MD5 (compatible con IOS 12.4)
hostname R2
interface FastEthernet0/0
 description WAN-hacia-R1
 ip address 10.16.0.2 255.255.255.252
 no shutdown
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 ClaveOSPF-lab
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 network 10.16.0.0 0.0.0.3 area 0
 network 2.2.2.2 0.0.0.0 area 0
